<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Dictionary</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f3f3f3;
            font-family: 'Poppins', sans-serif;
        }
        .wrapper {
            max-width: 400px;
            width: 100%;
            background: #fff;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .search input {
            width: 100%;
            height: 50px;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
        }
        .wrapper ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        .wrapper li {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .wrapper .word p {
            font-size: 22px;
            font-weight: 600;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>Dictionary</header>
        <div class="search">
            <input type="text" placeholder="Search a word" required spellcheck="false">
            <i class="fas fa-search"></i>
            <span class="material-icons">close</span>
        </div>
        <p class="info-text">Type a word and press Enter</p>
        <ul>
            <li class="word">
                <div class="details">
                    <p></p>
                    <span></span>
                </div>
                <i class="fas fa-volume-up"></i>
            </li>
            <div class="content">
                <li class="meaning"><div class="details"><p>Meaning</p><span></span></div></li>
                <li class="example"><div class="details"><p>Example</p><span></span></div></li>
            </div>
        </ul>
    </div>
    <audio id="sound"></audio>

    <script>
        const wrapper = document.querySelector(".wrapper"),
              searchInput = wrapper.querySelector("input"),
              volume = wrapper.querySelector(".word i"),
              infoText = wrapper.querySelector(".info-text");
        let audio;

        async function searchWord(word) {
            if (!word) return;
            infoText.innerText = `Looking up "${word}"...`;
            try {
                const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                const result = await res.json();
                if(result.title) {
                    infoText.innerText = `Can't find the meaning of "${word}".`;
                } else {
                    const data = result[0];
                    wrapper.classList.add("active");
                    document.querySelector(".word p").innerText = data.word;
                    document.querySelector(".word span").innerText = data.phonetics[0]?.text || "";
                    document.querySelector(".meaning span").innerText = data.meanings[0].definitions[0].definition;
                    document.querySelector(".example span").innerText = data.meanings[0].definitions[0].example || "No example available";

                    audio = new Audio(data.phonetics[0]?.audio || "");
                    if(audio.src) volume.style.color = "#4D59FB";
                    else volume.style.color = "#999";
                }
            } catch(e) {
                infoText.innerText = "Error fetching data.";
            }
        }

        searchInput.addEventListener("keyup", e => {
            if(e.key === "Enter" && searchInput.value.trim()) {
                searchWord(searchInput.value.trim());
            }
        });

        volume.addEventListener("click", () => { if(audio.src) audio.play(); });

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const word = params.get('word');
            if (word) {
                searchInput.value = word;
                searchWord(word);
            }
        });
    </script>
</body>
</html>
