<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <title>English Hub – Connexion</title>

    <style>
        :root {
            --body-color:   #E4E9F7;
            --primary-color:#695CFE;
            --primary-color-light: #F6F5FF;
            --card-bg:      #FFFFFF;
            --text-color:   #707070;
            --text-dark:    #0D1B3E;
            --navy:         #0D1B3E;
            --border-color: #F3F4F6;
            --error-color:  #EF4444;
        }

        body.dark {
            --body-color:   #080602;
            --primary-color:#C4A04B;
            --primary-color-light: rgba(196,160,75,0.1);
            --card-bg:      #1A1608;
            --text-color:   #8888A0;
            --text-dark:    #E8C878;
            --navy:         #E8E0D0;
            --border-color: rgba(196,160,75,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: var(--body-color);
            font-family: 'DM Sans', sans-serif;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
        }

        .logo {
            display: block;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 24px;
            text-align: center;
            color: var(--navy);
            text-decoration: none;
            margin-bottom: 4px;
        }

        .logo span { font-style: italic; color: var(--primary-color); }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-color);
            margin-bottom: 28px;
        }

        .tabs {
            display: flex;
            gap: 4px;
            background: var(--primary-color-light);
            border-radius: 40px;
            padding: 4px;
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active { background: var(--primary-color); color: white; }

        .field { margin-bottom: 16px; }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: var(--text-dark);
            background: var(--body-color);
        }

        .field input:focus { outline: none; border-color: var(--primary-color); }

        .btn-submit {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 40px;
            background: var(--primary-color);
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
            transition: filter 0.2s ease;
        }

        .btn-submit:hover { filter: brightness(1.1); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .form-message {
            margin-top: 14px;
            font-size: 13px;
            text-align: center;
            min-height: 18px;
        }

        .form-message.error { color: var(--error-color); }
        .form-message.success { color: #22C55E; }

        .signup-only { display: none; }
        .mode-signup .signup-only { display: block; }
    </style>
</head>
<body>

<div class="auth-card" id="authCard">
    <a class="logo" href="index.html">English <span>Hub</span></a>
    <div class="subtitle">Apprends l'anglais à ton rythme</div>

    <div class="tabs">
        <button class="tab-btn active" id="tabLogin" type="button">Connexion</button>
        <button class="tab-btn" id="tabSignup" type="button">Créer un compte</button>
    </div>

    <form id="authForm">
        <div class="field signup-only">
            <label for="pseudo">Pseudo</label>
            <input type="text" id="pseudo" placeholder="Ton nom d'affichage">
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="toi@exemple.com">
        </div>
        <div class="field">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" required placeholder="••••••••" minlength="6">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Se connecter</button>
        <div class="form-message" id="formMessage"></div>
    </form>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL = 'https://kkhcwcevcohpntxsiirq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_af0eX5Yf1HeYSzZq0-RFZQ_0a-6WL_8';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

if (localStorage.getItem('eh_dark') === 'true') document.body.classList.add('dark');

// Already logged in → straight to the dashboard
const { data: { session } } = await supabase.auth.getSession();
if (session) window.location.href = 'dashboard.html';

const authCard = document.getElementById('authCard');
const tabLogin = document.getElementById('tabLogin');
const tabSignup = document.getElementById('tabSignup');
const submitBtn = document.getElementById('submitBtn');
const formMessage = document.getElementById('formMessage');
let mode = 'login';

function setMode(newMode) {
    mode = newMode;
    authCard.className = mode === 'signup' ? 'auth-card mode-signup' : 'auth-card';
    tabLogin.classList.toggle('active', mode === 'login');
    tabSignup.classList.toggle('active', mode === 'signup');
    submitBtn.textContent = mode === 'signup' ? 'Créer mon compte' : 'Se connecter';
    formMessage.textContent = '';
    formMessage.className = 'form-message';
}

tabLogin.addEventListener('click', () => setMode('login'));
tabSignup.addEventListener('click', () => setMode('signup'));

// Landing page links: login.html?mode=signup opens the signup tab directly
if (new URLSearchParams(window.location.search).get('mode') === 'signup') {
    setMode('signup');
}

document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const pseudo = document.getElementById('pseudo').value.trim();

    submitBtn.disabled = true;
    formMessage.textContent = '';
    formMessage.className = 'form-message';

    if (mode === 'signup') {
        const { data, error } = await supabase.auth.signUp({ email, password });

        if (error) {
            formMessage.textContent = error.message;
            formMessage.className = 'form-message error';
            submitBtn.disabled = false;
            return;
        }

        // Email confirmation ON: no session yet, user must check their inbox.
        if (!data.session) {
            formMessage.textContent = 'Compte créé ! Vérifie ton email pour confirmer, puis connecte-toi.';
            formMessage.className = 'form-message success';
            submitBtn.disabled = false;
            setMode('login');
            return;
        }

        // Email confirmation OFF: session exists immediately — create the profile row.
        const { error: profileError } = await supabase.from('profiles').insert({
            id: data.user.id,
            pseudo: pseudo || 'Apprenant',
            endurance: 5, streak: 0, xp: 0
        });
        if (profileError) console.error('Profile creation failed:', profileError);

        window.location.href = 'dashboard.html';
    } else {
        const { error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
            formMessage.textContent = error.message === 'Invalid login credentials'
                ? 'Email ou mot de passe incorrect.'
                : error.message;
            formMessage.className = 'form-message error';
            submitBtn.disabled = false;
            return;
        }

        window.location.href = 'dashboard.html';
    }
});
</script>

</body>
</html>
